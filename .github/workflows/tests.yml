# Contrôle automatique : toute modification est testée avant d'être fusionnée dans main.
# Navigateur (faux Supabase), service worker, fonction d'envoi des rappels (Deno) et base PostgreSQL réelle.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/postgres
      TEST_OUT: /tmp/carnet-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Installer Playwright et Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Lancer tous les tests
        run: tests/run-all.sh
      - name: Conserver les captures en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captures-tests
          path: /tmp/carnet-tests
          if-no-files-found: ignore
          retention-days: 7
